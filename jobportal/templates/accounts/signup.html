{% extends "auth_base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h1 class="page-title mb-1">Create your account.</h1>
<p class="page-sub mb-4">Join as a job seeker or as an employer.</p>
<form method="post">{% csrf_token %}
  {% include "partials/form_fields.html" %}
  <button class="btn btn-primary w-100 py-2">Create account</button>
</form>
<p class="mt-3 mb-0 small text-muted">Already registered? <a href="{% url 'login' %}" class="fw-semibold">Log in</a></p>
{% endblock %}
