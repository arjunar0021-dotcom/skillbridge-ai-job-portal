{% extends "base.html" %}
{% block title %}Delete job{% endblock %}
{% block crumb %}Delete job{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card shadow-sm"><div class="card-body p-4 text-center">
      <h4>Delete "{{ job.title }}"?</h4>
      <p class="text-muted">This also deletes all applications and interviews for this job.</p>
      <form method="post">{% csrf_token %}
        <button class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'job_detail' job.pk %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
