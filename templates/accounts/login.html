{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1 class="page-title mb-1">Welcome back.</h1>
<p class="page-sub mb-4">Log in to continue to your workspace.</p>
<form method="post">{% csrf_token %}
  {% include "partials/form_fields.html" %}
  {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
  <button class="btn btn-primary w-100 py-2">Log in</button>
</form>
<p class="mt-3 mb-0 small text-muted">New to skillBridge? <a href="{% url 'signup' %}" class="fw-semibold">Create an account</a></p>
{% endblock %}
